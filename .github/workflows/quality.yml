name: Quality checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Check Python formatting
        run: ruff format --check .
      - name: Check Python lint
        run: ruff check .
      - name: Check static types
        run: mypy --strict app
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Run tests with coverage
        run: python -m pytest -q
      - name: Check repository size
        run: |
          bytes=$(git ls-tree -rl HEAD | awk '$2 == "blob" {total += $4} END {print total+0}')
          echo "Tracked source size: $bytes bytes (limit: 10000000)"
          test "$bytes" -lt 10000000
      - name: Smoke test production startup
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uaqa-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/uaqa-server.log' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /tmp/uaqa-home.html
          curl --fail --silent --show-error http://127.0.0.1:8000/static/app.js > /dev/null
